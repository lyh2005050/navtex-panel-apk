name: Build APK
on: [workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Android
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk wget unzip gradle
      - name: Build APK
        run: |
          mkdir -p app/src/main/java/com/navtex/panel
          echo 'package com.navtex.panel;
import android.app.Activity;
import android.os.Bundle;
import android.webkit.WebView;
import android.webkit.WebViewClient;
public class MainActivity extends Activity {
  protected void onCreate(Bundle savedInstanceState) {
    super.onCreate(savedInstanceState);
    WebView w = new WebView(this);
    w.getSettings().setJavaScriptEnabled(true);
    w.setWebViewClient(new WebViewClient());
    w.loadUrl("https://doubao.com/app/app_17ehvuar44v");
    setContentView(w);
  }
}' > app/src/main/java/com/navtex/panel/MainActivity.java
      - name: Upload to Release
        uses: actions/upload-artifact@v4
        with:
          name: navtex-panel-apk
          path: app/**/*.apk
