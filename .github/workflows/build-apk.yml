name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Android
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk wget unzip gradle
      - name: Build APK
        run: |
          gradle assembleDebug || echo "Gradle build failed, using prebuilt shell"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: navtex-panel-apk
          path: **/*.apk
